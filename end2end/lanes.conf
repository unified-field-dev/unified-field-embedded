# Settings for run-lanes.sh. Paths are relative to the repo root.
BUILD_CMD="cargo leptos build --project {{project-name}} --split --bin-features ssr,server-embedded,e2e-host-conformance --lib-features hydrate"   # as in ci.yml
PROFILE=debug
REPO_ROOT=..                       # a generated host may not be a git checkout yet
SERVER_BIN=server          # under ${CARGO_TARGET_DIR:-target}/$PROFILE
SITE_ROOT=target/site
OUTPUT_NAME={{project-name}}
PORT=3000                          # lane i serves on PORT + 100 + i
READY_PATH=/health
SERVER_ENV="CI=true UF_E2E_SEED_TOKEN=ci-embedded-e2e-seed-token-not-for-production VALENCE_SQLITE_PATH=:memory: PHOTON_ALLOW_DEV_TRANSPORT_KEY=1 PHOTON_TRANSPORT_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="   # the CI e2e step env
# The server accepts loopback origins on its default port only.
LANE_ENV="PHOTON_LEPTOS_ALLOWED_ORIGINS=http://127.0.0.1:{port},http://localhost:{port}"   # {port}: the lane's port
LANES_DEFAULT=8
