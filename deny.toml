# cargo-deny policy for unified-field-embedded (supply-chain gate).
# Tune advisories over time; CI runs `cargo deny check`.

[graph]
all-features = false
no-default-features = false

[advisories]
yanked = "warn"
unmaintained = "workspace"
ignore = [
    # Transitive hickory-proto via mail stack; upgrade when lepton-smtp moves.
    { id = "RUSTSEC-2026-0119", reason = "hickory-proto 0.24 O(n^2) via lettre; track lepton-smtp upgrade" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-org = { github = ["unified-field-dev", "deathbreakfast"] }
