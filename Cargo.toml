[workspace]
resolver = "2"
members = [
    "app",
    "frontend",
    "server",
    "photon-uf-embedded",
    "chronon-uf-embedded",
    "boson-uf-embedded",
    "spectra-uf-embedded",
    "{{project-name}}-e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Full DWARF for the whole shell overflows 32-bit debug relocations (>4 GiB)
# when linking test binaries; line tables keep backtraces and stay small.
[profile.dev]
debug = "line-tables-only"
incremental = true

# Match web-app-template: optimize deps in dev so the hydrate WASM stays
# under Chrome's ~1 GiB module limit (unoptimized deps balloon to >1.3 GiB).
[profile.dev.package."*"]
opt-level = 1

# Size-optimized hydrate WASM for `cargo leptos build --release` (and `--split`).
# Prefer thin LTO: full LTO + codegen-units=1 can trip rust-lld on this workspace.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"

[workspace.dependencies]
leptos = { version = "0.8.20", default-features = false, features = ["nightly"] }
leptos_meta = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false, features = ["nightly"] }
leptos_axum = { version = "0.8", default-features = false }
leptos_config = { version = "0.8", default-features = false }
leptos_dom = { version = "0.8", default-features = false }
leptos_integration_utils = { version = "0.8", default-features = false }
leptos_macro = { version = "0.8", default-features = false }
leptos_server = { version = "0.8", default-features = false }
leptos-use = { version = "0.18", default-features = false }
codee = { version = "0.3", default-features = false }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
cfg-if = "1"
console_error_panic_hook = "0.1"
console_log = "0.1"
http = "1"
icondata = { version = "0.4.0", default-features = false, features = ["ant-design-icons", "box-icons", "lucide"] }
icondata_core = "0.1.0"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simple_logger = "5"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6", features = ["fs", "compression-br", "compression-gzip", "set-header"] }
tower-sessions = "0.14.0"
time = "0.3"
axum-login = "0.18.0"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "=0.3.103", features = ["CssStyleDeclaration", "DataTransfer", "Document", "DomRect", "Element", "EventTarget", "FileList", "HtmlDivElement", "HtmlElement", "HtmlInputElement", "MediaQueryList", "Node", "NodeFilter", "Performance", "ScrollBehavior", "ScrollToOptions", "Storage", "TreeWalker", "Window"] }
turf = "0.10"
argon2 = "0.5"
password-hash = "0.5"
rand_core = { version = "0.6", features = ["std"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind", "serde"] }
inventory = "0.3"
