[[workspace.metadata.leptos]]
name = "{{project-name}}"
bin-package = "server"
lib-package = "frontend"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "public"
end2end-dir = "end2end"
end2end-cmd = "npm test"
site-addr = "0.0.0.0:3000"
reload-port = 3001
bin-features = ["ssr", "server-embedded"]
lib-features = ["hydrate"]
# Hydrate WASM uses the size-tuned profile above (pairs with `cargo leptos … --split`).
lib-profile-release = "wasm-release"
# Full-product host: platform runtimes + always-on admin UI.
# Marketing / Coming Soon: see unified-field-site.
# Avoid cargo-leptos overwriting .cargo/config.toml rustflags (getrandom + erase_components).
disable-erase-components = true
# SWC minify breaks wasm-split import namespaces (hydrate fails with
# "module is not an object or function" / net::ERR_ADDRESS_INVALID).
js-minify = false
# Default local/dev hydrate path: `cargo leptos watch --split` / `build --split`
# so app families (`/counter`, `/apps`, …) load as separate WASM chunks.

# Kits still declare Valence / Chronon / Orbital via crates.io. Redirect onto the
# same uf-dev git tips as [workspace.dependencies] so types unify (and pin
# parcel_selectors via Orbital's =0.28.2).
[patch."https://github.com/deathbreakfast/chronon-coordinator"]
chronon-coordinator = { git = "https://github.com/unified-field-dev/chronon-coordinator", branch = "main" }

[patch."https://github.com/deathbreakfast/boson-coordinator"]
boson-coordinator = { git = "https://github.com/unified-field-dev/boson-coordinator", branch = "main" }

